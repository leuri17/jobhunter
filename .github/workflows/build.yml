name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Default to least privilege. Build jobs override with `contents: write`
# below because `tauri-apps/tauri-action@v1` creates the GitHub release.
permissions:
  contents: read

jobs:
  build-linux:
    # tauri-action creates a draft release; needs contents: write.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: '.node-version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui build
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'JobHunter ${{ github.ref_name }}'
          releaseBody: 'Automated build'
          releaseDraft: true
          args: --target x86_64-unknown-linux-gnu

  build-macos:
    # tauri-action creates a draft release; needs contents: write.
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: '.node-version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui build
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'JobHunter ${{ github.ref_name }}'
          releaseBody: 'Automated build'
          releaseDraft: true

  build-windows:
    # tauri-action creates a draft release; needs contents: write.
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: '.node-version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui build
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'JobHunter ${{ github.ref_name }}'
          releaseBody: 'Automated build'
          releaseDraft: true
