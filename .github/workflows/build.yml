name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Default to least privilege. Build jobs override with `contents: write`
# below because `tauri-apps/tauri-action@v1` creates the GitHub release.
permissions:
  contents: read

jobs:
  build-linux:
    # tauri-action creates a draft release; needs contents: write.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui build
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'JobHunter ${{ github.ref_name }}'
          releaseBody: 'Automated build'
          releaseDraft: true
          args: --target x86_64-unknown-linux-gnu
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx-${{ runner.os }}-${{ github.ref_name }}.json

  build-macos:
    # tauri-action creates a draft release; needs contents: write.
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui build
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'JobHunter ${{ github.ref_name }}'
          releaseBody: 'Automated build'
          releaseDraft: true
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx-${{ runner.os }}-${{ github.ref_name }}.json

  build-windows:
    # tauri-action creates a draft release; needs contents: write.
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui build
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'JobHunter ${{ github.ref_name }}'
          releaseBody: 'Automated build'
          releaseDraft: true
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx-${{ runner.os }}-${{ github.ref_name }}.json
