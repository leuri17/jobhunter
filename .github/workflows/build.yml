name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Default to least privilege. Build jobs override with `contents: write`
# below because `tauri-apps/tauri-action@v1` creates the GitHub release.
permissions:
  contents: read

jobs:
  build-linux:
    # tauri-action creates a draft release; needs contents: write.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui build
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'JobHunter ${{ github.ref_name }}'
          releaseBody: 'Automated build'
          releaseDraft: true
          args: --target x86_64-unknown-linux-gnu

  build-macos:
    # tauri-action creates a draft release; needs contents: write.
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui build
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'JobHunter ${{ github.ref_name }}'
          releaseBody: 'Automated build'
          releaseDraft: true

  build-windows:
    # tauri-action creates a draft release; needs contents: write.
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui build
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1
        with:
          projectPath: desktop/tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'JobHunter ${{ github.ref_name }}'
          releaseBody: 'Automated build'
          releaseDraft: true
