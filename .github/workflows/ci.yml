name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dependabot's auto-generated PRs bump package.json but don't always regenerate
# pnpm-lock.yaml, which makes the downstream `pnpm install --frozen-lockfile`
# step fail with ERR_PNPM_OUTDATED_LOCKFILE. Granting `contents: write` lets
# the workflow refresh + commit the lockfile back to the dependabot branch
# (allowed by default for the dependabot[bot] actor).
permissions:
  contents: write

jobs:
  secrets:
    # Fail fast on planted secrets before tests run. Dedicated job so
    # the gitleaks checkout (fetch-depth: 0) is scoped here and does
    # not change the behavior of the test jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Detect secrets with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - name: Refresh lockfile (dependabot PRs only)
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          pnpm install --no-frozen-lockfile
          git config user.name "dependabot[bot]"
          git config user.email "dependabot[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore(deps): refresh pnpm-lock.yaml"
            git push
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # --coverage enables the per-file coverage thresholds declared in
      # vitest.config.ts, so a module dropping below its floor fails CI.
      - run: pnpm test --coverage

  sidecar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - name: Refresh lockfile (dependabot PRs only)
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          pnpm install --no-frozen-lockfile
          git config user.name "dependabot[bot]"
          git config user.email "dependabot[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore(deps): refresh pnpm-lock.yaml"
            git push
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/sidecar test

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - name: Refresh lockfile (dependabot PRs only)
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          pnpm install --no-frozen-lockfile
          git config user.name "dependabot[bot]"
          git config user.email "dependabot[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore(deps): refresh pnpm-lock.yaml"
            git push
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui test

  cargo-audit:
    # Gates on real risk via `./scripts/cargo-audit.sh`. The script
    # parses cargo-audit's JSON output and blocks only on vulnerabilities
    # + unsound advisories. The 17 transitive advisories pulled in by
    # tauri 2.11.5 are allowlisted at the script level; new
    # unmaintained advisories surface in the workflow log but don't
    # fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/tauri/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        run: ./scripts/cargo-audit.sh
