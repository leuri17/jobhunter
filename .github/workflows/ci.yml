name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dependabot's auto-generated PRs bump package.json but don't always regenerate
# pnpm-lock.yaml, which makes the downstream `pnpm install --frozen-lockfile`
# step fail with ERR_PNPM_OUTDATED_LOCKFILE. Granting `contents: write` lets
# the workflow refresh + commit the lockfile back to the dependabot branch
# (allowed by default for the dependabot[bot] actor).
permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - name: Refresh lockfile (dependabot PRs only)
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          pnpm install --no-frozen-lockfile
          git config user.name "dependabot[bot]"
          git config user.email "dependabot[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore(deps): refresh pnpm-lock.yaml"
            git push
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # --coverage enables the per-file coverage thresholds declared in
      # vitest.config.ts, so a module dropping below its floor fails CI.
      - run: pnpm test --coverage

  sidecar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - name: Refresh lockfile (dependabot PRs only)
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          pnpm install --no-frozen-lockfile
          git config user.name "dependabot[bot]"
          git config user.email "dependabot[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore(deps): refresh pnpm-lock.yaml"
            git push
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/sidecar test

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version-file: '.node-version' }
      - name: Refresh lockfile (dependabot PRs only)
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          pnpm install --no-frozen-lockfile
          git config user.name "dependabot[bot]"
          git config user.email "dependabot[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore(deps): refresh pnpm-lock.yaml"
            git push
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobhunter/ui test

  cargo-audit:
    # Audit the Tauri shell's Rust dependency graph. Runs weekly via
    # Dependabot (added in the same change) and on every push to main /
    # every PR.
    #
    # Currently advisory-only: the audit logs findings but does not
    # gate the build. The current dependency graph has 17 unmaintained /
    # unsound advisories (mostly transitive through tauri /
    # tauri-plugin-*), which the team needs to triage before flipping
    # to `--deny warnings`. The job's run step is `cargo audit --json`
    # + plain `cargo audit`, both with `|| true`, so the warnings
    # surface in the workflow log without failing CI. Replace with
    # `cargo audit --deny warnings` once the underlying advisories
    # are addressed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/tauri/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit (advisory)
        working-directory: desktop/tauri
        run: |
          cargo audit --json > audit.json || true
          cargo audit || true
