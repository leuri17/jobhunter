name: Responsible-use concern
description: Report a LinkedIn ToS concern or suspected misuse.
title: "[Responsible-use]: "
labels: ["responsible-use"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report a concern about how JobHunter is used
        (or to suggest an improvement to `docs/responsible-use.md`).
        Do not report general bugs here.
  - type: textarea
    id: concern
    attributes:
      label: Concern
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links, screenshots, or reproduction steps (no secrets).
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested action
